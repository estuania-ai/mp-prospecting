<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Mercado Pago Prospecting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: linear-gradient(135deg, #009EE3 0%, #1A1A2E 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.2); padding: 40px; width: 100%; max-width: 420px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo-img { width: 56px; height: 56px; background: #FFE600; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }
  h1 { font-size: 22px; color: #1A1A2E; margin-bottom: 4px; text-align: center; }
  .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #E0D9CC; border-radius: 8px; font-size: 14px; transition: border-color .2s; }
  input:focus { outline: none; border-color: #009EE3; }
  button { width: 100%; padding: 13px; background: #009EE3; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 4px; }
  button:hover { background: #007BB5; }
  .footer { margin-top: 22px; text-align: center; font-size: 13px; color: #666; }
  .footer a { color: #009EE3; text-decoration: none; font-weight: 600; }
  .flash { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
  .flash.error { background: #FEECEB; color: #C0392B; border-left: 3px solid #C0392B; }
  .flash.warning { background: #FFF8E1; color: #B7791F; border-left: 3px solid #F1C40F; }
  .flash.success { background: #E8F8F0; color: #1E8449; border-left: 3px solid #27AE60; }
  .flash.info { background: #E3F2FD; color: #1565C0; border-left: 3px solid #009EE3; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-img">🤝</div>
      <h1>MercadoPago Prospecting</h1>
      <div class="subtitle">Inicia sesión con tu cuenta</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus
               placeholder="tu.email@gmail.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               placeholder="Tu contraseña">
      </div>
      <button type="submit">Iniciar sesión</button>
    </form>

    <div class="footer">
      ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Registrarse</a>
    </div>
  </div>
</body>
</html>
